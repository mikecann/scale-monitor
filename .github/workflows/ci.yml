name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every PowerShell script
        shell: powershell
        run: .\scripts\check-syntax.ps1
      - name: Test standalone installation with mocked COM
        shell: powershell
        run: .\tests\install.Tests.ps1
